[package]
name = "spin-tracker-op"
version = "0.1.0"
description = "Spin Tracker OP - tracker open source pour Spin & Go / Twister / Expresso"
authors = ["Spin Tracker OP contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "spin-tracker-op"

[[bin]]
name = "spinop-cli"
path = "src/bin/cli.rs"

[lib]
name = "spin_tracker_op_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"
rayon = "1.10"
rmp-serde = "1.3"
walkdir = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
